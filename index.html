(function(){
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }
  var c=document.createElement('canvas');c.width=c.height=180;
  var ctx=c.getContext('2d');
  roundRect(ctx,0,0,180,180,36);ctx.fillStyle='#2C2C2A';ctx.fill();
  ctx.strokeStyle='#D3D1C7';ctx.lineWidth=8;ctx.lineJoin='round';ctx.lineCap='round';
  /* 屋顶 */ ctx.beginPath();ctx.moveTo(28,92);ctx.lineTo(90,40);ctx.lineTo(152,92);ctx.stroke();
  /* 墙体 */ ctx.beginPath();ctx.moveTo(46,92);ctx.lineTo(46,148);ctx.lineTo(134,148);ctx.lineTo(134,92);ctx.stroke();
  /* 门 */   ctx.beginPath();ctx.moveTo(74,148);ctx.lineTo(74,116);ctx.quadraticCurveTo(74,108,90,108);ctx.quadraticCurveTo(106,108,106,116);ctx.lineTo(106,148);ctx.stroke();
  var lnk=document.createElement('link');lnk.rel='apple-touch-icon';lnk.href=c.toDataURL();
  document.head.appendChild(lnk);
})();
</script>

<script>
let term=25,history=[],lastRows=null;
let trendChart=null,barChart=null,bar2Chart=null,bar3Chart=null;
let selComp=new Set();

function fmt(n){return Math.round(n).toLocaleString('zh-CN')}
function fmtW(n){
  if(n>=100000000)return (n/100000000).toFixed(2)+'亿';
  if(n>=10000)return (n/10000).toFixed(1)+'万';
  return fmt(n);
}
function calcM(p,r,y){
  let mr=r/100/12,n=y*12;
  if(mr===0)return p/n;
  return p*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);
}
function buildRows(p,r,y){
  let mr=r/100/12,n=y*12,m=calcM(p,r,y),bal=p,rows=[];
  for(let i=1;i<=n;i++){
    let ip=bal*mr,pp=m-ip;
    bal=Math.max(0,bal-pp);
    rows.push({i,m,ip,pp,bal});
  }
  return rows;
}

document.getElementById('principal').addEventListener('input',function(){
  document.getElementById('pslider').value=Math.min(10000000,Math.max(100000,+this.value||100000));
});

function setTerm(t){
  term=t;
  [20,25,30].forEach(y=>document.getElementById('t'+y).classList.toggle('active',y===t));
}

function sw(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+id).classList.add('on');
  const ids=['calc','trend','amort','compare','history'];
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',ids[i]===id));
}

function calc(){
  let p=+document.getElementById('principal').value;
  let r=+document.getElementById('rate').value;
  if(!p||!r||p<=0||r<=0)return;

  let m=calcM(p,r,term),tot=m*term*12,intr=tot-p;
  document.getElementById('r-m').textContent=fmt(m);
  document.getElementById('r-t').textContent=fmtW(tot);
  document.getElementById('r-i').textContent=fmtW(intr);
  document.getElementById('res').style.display='block';

  let cg=document.getElementById('cmp-grid');cg.innerHTML='';
  [20,25,30].forEach(y=>{
    let mm=calcM(p,r,y),tt=mm*y*12,ii=tt-p;
    let d=document.createElement('div');
    d.className='metric'+(y===term?' acc':'');
    d.innerHTML=`<div class="ml">${y}年</div><div class="mv">${fmt(mm)}</div><div class="ms">月供/元</div><div style="font-size:10px;margin-top:4px;color:${y===term?'var(--accent-text)':'var(--text3)'}">利息 ${fmtW(ii)}</div>`;
    d.style.cursor='pointer';
    d.addEventListener('click',()=>{setTerm(y);calc();});
    cg.appendChild(d);
  });

  let rows=buildRows(p,r,term);
  lastRows=rows;
  renderTrend(rows);
  renderAmort(rows);

  let ts=new Date();
  let timeStr=ts.getHours().toString().padStart(2,'0')+':'+ts.getMinutes().toString().padStart(2,'0');
  let rec={id:Date.now(),p,r,term,m,tot,intr,rows,label:`${fmtW(p)} · ${r}% · ${term}年`,time:timeStr};
  history.unshift(rec);
  if(history.length>20)history.pop();
  renderHistory();
  renderCompChips();
}

function renderTrend(rows){
  document.getElementById('trend-empty').style.display='none';
  let skip=Math.ceil(rows.length/60);
  let f=rows.filter((_,i)=>i%skip===0||i===rows.length-1);
  let lbls=f.map(r=>r.i+'期');
  let pps=f.map(r=>Math.round(r.pp));
  let ips=f.map(r=>Math.round(r.ip));
  let bals=f.map(r=>Math.round(r.bal));
  if(trendChart){trendChart.destroy();}
  const isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  const gridColor=isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';
  trendChart=new Chart(document.getElementById('trendChart'),{
    type:'bar',
    data:{labels:lbls,datasets:[
      {label:'本金',data:pps,backgroundColor:isDark?'#5F5E5A':'#444441',stack:'s',order:2},
      {label:'利息',data:ips,backgroundColor:isDark?'#444441':'#B4B2A9',stack:'s',order:2},
      {label:'剩余本金',data:bals,type:'line',borderColor:'#888780',borderWidth:1.5,borderDash:[4,3],pointRadius:0,fill:false,yAxisID:'y2',order:1}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.raw)}元`}}},
      scales:{
        x:{stacked:true,ticks:{maxTicksLimit:10,font:{size:10},color:isDark?'#888780':'#888780'},grid:{display:false}},
        y:{stacked:true,ticks:{font:{size:10},color:isDark?'#888780':'#888780',callback:v=>fmtW(v)},grid:{color:gridColor}},
        y2:{position:'right',ticks:{font:{size:10},color:isDark?'#888780':'#888780',callback:v=>fmtW(v)},grid:{display:false}}
      }
    }
  });
}

function renderAmort(rows){
  let wrap=document.getElementById('amort-wrap');
  let html=`<div class="panel"><div class="plbl">逐期还款明细</div>
  <div class="amort-hdr"><span>期次</span><span>月供</span><span>本金</span><span>利息</span><span>剩余本金</span></div>
  <div class="atbl">`;
  let py=0;
  rows.forEach(r=>{
    let yr=Math.ceil(r.i/12);
    if(yr!==py){html+=`<div class="yr-div">第 ${yr} 年</div>`;py=yr;}
    html+=`<div class="arow"><span>${r.i}</span><span>${fmt(r.m)}</span><span>${fmt(r.pp)}</span><span>${fmt(r.ip)}</span><span>${fmt(r.bal)}</span></div>`;
  });
  html+='</div></div>';
  wrap.innerHTML=html;
}

function renderHistory(){
  let el=document.getElementById('hlst');
  if(!history.length){el.innerHTML='<div class="empty">暂无历史记录</div>';return;}
  document.getElementById('export-row').style.display='flex';
  el.innerHTML=history.map((h,i)=>`
    <div class="hi" onclick="loadHist(${i})">
      <div class="hi-dot"></div>
      <div class="hm">
        <div class="h1">${h.label}</div>
        <div class="h2">利息 ${fmtW(h.intr)} · ${h.term*12}期</div>
      </div>
      <div class="hmv">${fmt(h.m)}<span style="font-size:10px;font-weight:400;margin-left:2px">元</span></div>
      <div class="htm">${h.time}</div>
    </div>`).join('');
}

function loadHist(i){
  let h=history[i];
  document.getElementById('principal').value=h.p;
  document.getElementById('pslider').value=Math.min(10000000,Math.max(100000,h.p));
  document.getElementById('rate').value=h.r;
  setTerm(h.term);sw('calc');calc();
}

function renderCompChips(){
  let el=document.getElementById('comp-chips');
  if(!history.length){el.innerHTML='<div style="font-size:12px;color:var(--text3);padding:8px 0">请先完成计算后再来对比</div>';return;}
  el.innerHTML=history.map((h,i)=>`<button class="sel-chip${selComp.has(i)?' on':''}" onclick="toggleComp(${i})">${h.label}</button>`).join('');
}

function toggleComp(i){
  if(selComp.has(i)){selComp.delete(i);}
  else if(selComp.size<4){selComp.add(i);}
  renderCompChips();renderCompCharts();
}

function renderCompCharts(){
  let wrap=document.getElementById('comp-charts-wrap');
  let empty=document.getElementById('comp-empty');
  if(selComp.size<1){
    if(empty)empty.style.display='block';
    [barChart,bar2Chart,bar3Chart].forEach(c=>{if(c)c.destroy();});
    barChart=bar2Chart=bar3Chart=null;
    return;
  }
  if(empty)empty.style.display='none';
  let items=[...selComp].map(i=>history[i]);
  let lbls=items.map(h=>h.label);
  const isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  let PAL=isDark?['#E8E6DE','#B4B2A9','#888780','#5F5E5A']:['#2C2C2A','#5F5E5A','#888780','#B4B2A9'];
  let PAT=PAL.map(c=>c+'40');

  let h=Math.max(180,items.length*56+80);
  wrap.innerHTML=`
    <div class="section-title">月供金额对比</div>
    <div class="chart-wrap" style="height:${h}px"><canvas id="bc1" role="img" aria-label="各贷款方案月供金额对比">月供对比</canvas></div>
    <div class="section-title" style="margin-top:20px">本金 vs 利息构成</div>
    <div class="chart-wrap" style="height:${h}px"><canvas id="bc2" role="img" aria-label="本金与利息构成对比">本息构成</canvas></div>
    <div class="section-title" style="margin-top:20px">还款总额对比</div>
    <div class="chart-wrap" style="height:${h}px"><canvas id="bc3" role="img" aria-label="还款总额对比">总额对比</canvas></div>`;

  const gridColor=isDark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.05)';
  const tickColor=isDark?'#888780':'#888780';
  const baseOpts=(extra={})=>({
    indexAxis:'y',responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},...extra.plugins},
    scales:{
      x:{ticks:{callback:v=>fmtW(v),font:{size:10},color:tickColor},grid:{color:gridColor}},
      y:{ticks:{font:{size:10},color:tickColor}},...(extra.scales||{})
    }
  });

  if(barChart)barChart.destroy();
  barChart=new Chart(document.getElementById('bc1'),{
    type:'bar',
    data:{labels:lbls,datasets:[{label:'月供',data:items.map(h=>Math.round(h.m)),backgroundColor:PAL}]},
    options:{...baseOpts({plugins:{tooltip:{callbacks:{label:c=>`月供: ${fmt(c.raw)}元`}}}})}
  });

  if(bar2Chart)bar2Chart.destroy();
  bar2Chart=new Chart(document.getElementById('bc2'),{
    type:'bar',
    data:{labels:lbls,datasets:[
      {label:'贷款本金',data:items.map(h=>Math.round(h.p)),backgroundColor:PAL},
      {label:'利息总额',data:items.map(h=>Math.round(h.intr)),backgroundColor:PAT,borderColor:PAL,borderWidth:1}
    ]},
    options:{...baseOpts({plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmtW(c.raw)}元`}}}})}
  });

  if(bar3Chart)bar3Chart.destroy();
  bar3Chart=new Chart(document.getElementById('bc3'),{
    type:'bar',
    data:{labels:lbls,datasets:[{label:'还款总额',data:items.map(h=>Math.round(h.tot)),backgroundColor:PAL}]},
    options:{...baseOpts({plugins:{tooltip:{callbacks:{label:c=>`总额: ${fmtW(c.raw)}元`}}}})}
  });
}

function exportCSV(){
  if(!history.length)return;
  let rows=[['方案','月供(元)','还款总额(元)','利息总额(元)','年限','本金','利率']];
  history.forEach(h=>{
    rows.push([h.label,Math.round(h.m),Math.round(h.tot),Math.round(h.intr),h.term+'年',h.p,h.r+'%']);
  });
  let csv=rows.map(r=>r.join(',')).join('\n');
  let blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='房贷计算记录_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.csv';
  a.click();URL.revokeObjectURL(a.href);
}

function copyShare(){
  if(!history.length)return;
  let lines=['【房贷计算快照】导出时间：'+new Date().toLocaleString('zh-CN'),''];
  history.forEach((h,i)=>{
    lines.push(`${i+1}. ${h.label}`);
    lines.push(`   月供：${fmt(h.m)} 元/月  |  利息：${fmtW(h.intr)}  |  总额：${fmtW(h.tot)}`);
  });
  let txt=lines.join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    let btn=event.currentTarget;let o=btn.innerHTML;
    btn.innerHTML='✓ 已复制（共'+history.length+'条）';
    setTimeout(()=>{btn.innerHTML=o;},2500);
  }).catch(()=>alert(txt));
}

/* ── 核心：带数据快照导出完整网页 ── */
function exportWithSnapshot(){
  if(!history.length){alert('请先完成至少一次计算再导出');return;}

  /* 精简历史数据（去掉 rows 只保留摘要，节省体积） */
  let snap=history.map(h=>({
    id:h.id,p:h.p,r:h.r,term:h.term,
    m:Math.round(h.m),tot:Math.round(h.tot),intr:Math.round(h.intr),
    label:h.label,time:h.time
  }));
  let snapJSON=JSON.stringify(snap);
  let exportTime=new Date().toLocaleString('zh-CN');

  /* 读取当前页面全部 HTML 源码 */
  let src=document.documentElement.outerHTML;

  /* 在 </body> 前注入：快照数据 + 自动加载逻辑 + 快照提示横幅 */
  let injection=`
<script id="snapshot-data">
(function(){
  var SNAP=${snapJSON};
  /* 将快照还原进 history 数组，等页面脚本初始化完后执行 */
  window.__SNAPSHOT__=SNAP;
  window.__SNAPSHOT_TIME__="${exportTime}";
})();
<\/script>
<script>
window.addEventListener('DOMContentLoaded',function(){
  if(!window.__SNAPSHOT__||!window.__SNAPSHOT__.length)return;
  /* 注入历史记录 */
  history=window.__SNAPSHOT__.map(function(h){
    /* 重建 rows 供趋势/明细页使用 */
    var rows=buildRows(h.p,h.r,h.term);
    return Object.assign({},h,{rows:rows});
  });
  renderHistory();
  renderCompChips();
  /* 显示快照横幅 */
  var banner=document.getElementById('snapshot-banner');
  if(banner){
    banner.style.display='flex';
    banner.querySelector('#snap-time').textContent=window.__SNAPSHOT_TIME__;
    banner.querySelector('#snap-count').textContent=history.length;
  }
  /* 自动加载第一条到计算页 */
  if(history.length>0){
    var h=history[0];
    document.getElementById('principal').value=h.p;
    document.getElementById('pslider').value=Math.min(10000000,Math.max(100000,h.p));
    document.getElementById('rate').value=h.r;
    setTerm(h.term);
    calc();
  }
});
<\/script>`;

  /* 插入快照横幅 HTML（放在 <header> 前） */
  let banner=`<div id="snapshot-banner" style="display:none;align-items:center;gap:10px;background:#2C2C2A;color:#D3D1C7;padding:10px 20px;border-radius:8px;margin-bottom:20px;font-size:13px;">
  <span style="font-size:18px;">📦</span>
  <span>数据快照 · 导出于 <b id="snap-time"></b> · 共 <b id="snap-count"></b> 条历史记录</span>
  <span style="margin-left:auto;opacity:.6;font-size:11px;letter-spacing:.05em;">SNAPSHOT MODE</span>
</div>`;

  src=src.replace('<header>',banner+'<header>');
  src=src.replace('</body>',injection+'</body>');

  /* 修改 title 加上导出时间 */
  src=src.replace('<title>房贷计算器 · 等额本息</title>',
    `<title>房贷计算快照 · ${exportTime}</title>`);

  let blob=new Blob([src],{type:'text/html;charset=utf-8'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='房贷快照_'+new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')+'.html';
  a.click();URL.revokeObjectURL(a.href);
}
</script>
</body>
</html>
